/* Layout: full-bleed WebGL canvas; no words during play. A wind glyph invites the first breath; a title veil opens and closes the loop. */
:root {
  color-scheme: dark;
  --ink: #fbf1e4;
  --muted: #e2d3c0;
  --line: rgba(255, 236, 210, 0.32);
  --ground: #1f2526;

}
html, body { height: 100%; margin: 0; overflow: hidden; background: var(--ground); color: var(--ink); font-family: var(--ui); }
#stage { position: fixed; inset: 0; }
#stage canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: crosshair; }

.hud { position: fixed; pointer-events: none; transition: opacity 1.2s ease; }
.hud.off { opacity: 0 !important; }
#arrow { bottom: calc(env(safe-area-inset-bottom, 0px) + 22px); left: 50%; margin-left: -9px; width: 18px; height: 18px; transition: transform 0.3s ease-out, opacity 0.8s ease; filter: drop-shadow(0 1px 4px rgba(20, 16, 10, 0.5)); }
#blow { bottom: calc(env(safe-area-inset-bottom, 0px) + 12%); left: 50%; width: 64px; height: 40px; margin-left: -32px; animation: breathe 2.4s ease-in-out infinite; filter: drop-shadow(0 1px 6px rgba(20, 16, 10, 0.45)); }
@keyframes breathe { 0%, 100% { opacity: 0.25; transform: translateX(-4px); } 50% { opacity: 0.85; transform: translateX(4px); } }

.veil { position: fixed; inset: 0; display: grid; place-items: center; padding: 16px; background: radial-gradient(ellipse at 50% 55%, rgba(30, 26, 20, 0), rgba(18, 16, 12, 0.35)); transition: opacity 1.6s ease; }
.veil.gone { opacity: 0; pointer-events: none; }
.intro { display: grid; justify-items: center; gap: 18px; text-align: center; text-shadow: 0 2px 18px rgba(20, 16, 10, 0.45); }
.intro h1 { margin: 0; font-family: var(--display); font-weight: 400; font-size: clamp(38px, 8vw, 64px); line-height: 1; letter-spacing: 0.02em; text-wrap: balance; }
.go { font: 400 14px var(--ui); color: var(--ink); background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 10px 30px; cursor: pointer; letter-spacing: 0.18em; transition: background 0.3s ease, border-color 0.3s ease; }
.go:hover { background: rgba(255, 236, 210, 0.12); border-color: rgba(255, 236, 210, 0.6); }
.go:focus-visible { outline: 1px solid var(--ink); outline-offset: 4px; }
.fine { margin: 0; font-size: 11px; letter-spacing: 0.08em; color: var(--muted); opacity: 0.75; }
#tip { left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom, 0px) + 13%); padding: 0 max(16px, env(safe-area-inset-left, 0px)); text-align: center; font-size: 14px; letter-spacing: 0.06em; color: var(--ink); text-shadow: 0 1px 10px rgba(20, 16, 10, 0.6); transition: opacity 1.4s ease; }
#fade { position: fixed; inset: 0; background: #f6f1e8; opacity: 0; pointer-events: none; transition: opacity 3s ease; }
#fade.on { opacity: 1; }
@media (prefers-reduced-motion: reduce) { .hud, .veil, #arrow, #fade { transition: none; } #blow { animation: none; opacity: 0.7; } }

// Telegram Mini App setup. Every call is guarded so the page also works in a normal browser
// and in older Telegram clients.
(function () {
  var tg = window.Telegram && window.Telegram.WebApp;
  if (!tg || !tg.initData && !tg.platform) return;
  var atLeast = function (v) { try { return tg.isVersionAtLeast && tg.isVersionAtLeast(v); } catch (e) { return false; } };
  try { tg.ready(); } catch (e) {}
  try { tg.expand(); } catch (e) {}
  try { if (atLeast('7.7') && tg.disableVerticalSwipes) tg.disableVerticalSwipes(); } catch (e) {}
  try { if (atLeast('8.0') && tg.requestFullscreen) tg.requestFullscreen(); } catch (e) {}
  try { if (atLeast('8.0') && tg.lockOrientation) tg.lockOrientation(); } catch (e) {}
  try { if (tg.setHeaderColor) tg.setHeaderColor('#1f2526'); } catch (e) {}
  try { if (tg.setBackgroundColor) tg.setBackgroundColor('#1f2526'); } catch (e) {}
  // light taps from the phone's haptic engine
  window.__haptic = function (kind) { try { if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred(kind); } catch (e) {} };
  // re-fit the canvas whenever Telegram expands or goes fullscreen
  var refit = function () { setTimeout(function () { if (window.__fit) window.__fit(); }, 60); };
  try { tg.onEvent('viewportChanged', refit); tg.onEvent('fullscreenChanged', refit); } catch (e) {}
  // tilt steering: neutral pose is taken when the player presses "подуть"
  if (atLeast('8.0') && tg.DeviceOrientation) {
    var base = null, deg = null;
    window.__tiltRecenter = function () { base = null; };
    try {
      tg.onEvent('deviceOrientationChanged', function () {
        var o = tg.DeviceOrientation, b = o.beta, g = o.gamma;
        if (b == null || g == null) return;
        if (deg === null) deg = Math.abs(b) > 6.3 || Math.abs(g) > 6.3;
        if (!deg) { b *= 57.2958; g *= 57.2958; }
        if (!base) base = { b: b, g: g };
        var cl = function (v) { return Math.max(-1, Math.min(1, v)); };
        window.__tilt = { x: cl((g - base.g) / 22), y: cl(-(b - base.b) / 22) };
      });
      tg.DeviceOrientation.start({ refresh_rate: 30 });
    } catch (e) {}
  }
})();

<script>
(() => {
'use strict';

// ================= utils =================

        if (md < 9 && md > 0.01) { const pull = Math.sqrt(1 - md / 9); L.yaw += angDiff(L.yaw, Math.atan2(_l.x, _l.z)) * damp(3 * pull, dt); _l.multiplyScalar(Math.max(L.speed, 5) / md); L.vel.lerp(_l, damp(8, dt) * pull); }
      }
      for (const cur of currents) {
        if (T < cur.cool) continue;
        _l.subVectors(cur.start, L.pos); const d = _l.length();
        if (d < 9) { cine = { mode: 'current', t: 0, cur, u: 0 }; break; }
        if (d < 32) { L.yaw += angDiff(L.yaw, Math.atan2(_l.x, _l.z)) * damp(2.2 * (1 - d / 32), dt); L.vel.lerp(_l.multiplyScalar(8 / d), damp(2, dt) * (1 - d / 32)); }
      }
      for (const p of SPOTS) if (!visited.has(p.id) && Math.hypot(p.x - L.pos.x, p.z - L.pos.z) < (p.r || 28) + 14) { visited.add(p.id); startOrbit(p); break; }
      if (ageS > 0.95 && Math.hypot(L.pos.x - BIRTH.x, L.pos.z - BIRTH.z) < 26) startEnding();
    }
    if (cine.mode === 'lookback') {
      const side = new THREE.Vector3(dirV.z, 0, -dirV.x);
      camTarget.copy(L.pos).addScaledVector(dirV, 7.5).addScaledVector(side, 2.5); camTarget.y += 2.4; lookAt.copy(L.pos).addScaledVector(dirV, -7);
      camK = 2.4; fovT = 66;
      if (cine.t > cine.dur) endCine();
    } else {
      // speed feel: the faster the stream, the further the camera falls back and the wider the view
      speedFx = lerp(speedFx, sstep(4.5, 13, L.vel.length()), damp(1.8, dt));
      camTarget.copy(L.pos).addScaledVector(dirV, -(5.6 + speedFx * 2.6)); camTarget.y += 1.9 + speedFx * 0.6; lookAt.copy(L.pos).addScaledVector(dirV, 3 + speedFx * 2);
      fovT = 62 + speedFx * 12;
    }
    L.pos.addScaledVector(L.vel, dt);
  }

  if (flying) {
    const g = G(L.pos.x, L.pos.z);
    if (L.pos.y < g + 0.6) { L.pos.y = g + 0.6; if (L.vel.y < 0) L.vel.y = 0; }
    if (cine.mode !== 'current') { const nrm = new THREE.Vector3(); if (resolve(L.pos, 0.45, nrm) && nrm.lengthSq() > 1e-6) { nrm.normalize(); const into = L.vel.dot(nrm); if (into < 0) L.vel.addScaledVector(nrm, -into * 1.15); } }
    updateProgress();
  }
  ageS = lerp(ageS, age, damp(0.6, dt));
  applyEnv(ageS);

  const homeDir = tmpV.set(HOME.x - camera.position.x, 0, HOME.z - camera.position.z).normalize(), camF = camera.getWorldDirection(_b);
  const homeUnseen = homeDir.x * camF.x + homeDir.z * camF.z < 0.2;
  if (!homeIsOld && ageS > 0.72 && (Math.hypot(L.pos.x - HOME.x, L.pos.z - HOME.z) > 120 || homeUnseen)) { setHomeOld(true); birthYoung.visible = false; birthOld.visible = true; }
  if (swingPivot && homeYoung.visible) {
    swingPivot.rotation.z = Math.sin(T * 1.3) * 0.28;
    const tg = H(TREE.x, TREE.z), hand = new THREE.Vector3(TREE.x - 8, tg + 0.6, TREE.z + 12);
    kite.position.set(hand.x + 10 + Math.sin(T * 0.4) * 3, hand.y + 24 + Math.sin(T * 0.7) * 2, hand.z + 16 + Math.cos(T * 0.5) * 2);
    kite.rotation.set(0.3 + Math.sin(T * 1.1) * 0.15, Math.PI * 0.75, Math.sin(T * 0.9) * 0.3);
    const kp = kiteLine.geometry.attributes.position; kp.setXYZ(0, hand.x, hand.y, hand.z); kp.setXYZ(1, kite.position.x, kite.position.y - 0.6, kite.position.z); kp.needsUpdate = true;
  }

  if (flying && suitorIdx < SUITORS.length && ageS > SUITORS[suitorIdx].at) spawnStream(SUITORS[suitorIdx++]);
  if (partner && !partnerLand && ageS > 0.87 && chain.includes(partner)) {
    chain.splice(chain.indexOf(partner), 1);
    partnerLand = { p: partner, state: 'fly', to: restFlower.pos.clone(), vel: new THREE.Vector3(), yaw: Math.random() * 6, glow: 1 };
    if (AC) { const t = noteTime(); voice(SCALE[3], t, 4, 0.08); voice(SCALE[7], t + 0.4, 4, 0.06); bass(61.74, t); }
  }
  if (ageS > 0.88 && flying && T > nextDrift && chain.length > 1) {
    nextDrift = T + 2.6; const p = chain.pop();
    drifting.push({ p, v: new THREE.Vector3((Math.random() - 0.5) * 2, 0.5 + Math.random() * 0.8, (Math.random() - 0.5) * 2), t: 0 });
  }
  for (let i = drifting.length - 1; i >= 0; i--) {
    const d = drifting[i]; d.t += dt;
    d.v.y -= 0.25 * dt; d.v.x += Math.sin(T + i) * 0.3 * dt;
    d.p.pos.addScaledVector(d.v, dt);
    d.p.mesh.position.copy(d.p.pos); d.p.mesh.rotation.x += dt * 1.3; d.p.mesh.rotation.z += dt * 0.9;
    d.p.mesh.scale.setScalar(clamp(1 - (d.t - 5) / 3, 0, 1));
    if (d.t > 8) { scene.remove(d.p.mesh); drifting.splice(i, 1); }
  }

  // --- trail & chain
  let last = trail[trail.length - 1];
  if (!last) { trail.push(L.pos.clone()); last = trail[0]; }
  let dd = last.distanceTo(L.pos), guard = 0;
  while (dd > STEP && guard++ < 80) { const p = last.clone().lerp(L.pos, STEP / dd); trail.push(p); last = p; dd = last.distanceTo(L.pos); }
  const need = (chain.length + 2) * PER + 20;
  if (trail.length > need + 300) trail.splice(0, trail.length - need);
  chain[0].pos.copy(L.pos);
  for (let i = 1; i < chain.length; i++) {
    const p = chain[i], tgt = trail[Math.max(0, trail.length - 1 - i * PER)];
    tmpV.set(Math.sin(T * 1.3 + p.phase) * 0.28, Math.cos(T * 1.7 + p.phase) * 0.22, Math.sin(T * 1.1 + p.phase * 2) * 0.28).add(tgt);
    p.pos.lerp(tmpV, damp(3.5, dt));
    const gy = G(p.pos.x, p.pos.z) + 0.3; if (p.pos.y < gy) p.pos.y = gy;
    resolve(p.pos, 0.3, _n.set(0, 0, 0));
  }
  for (let i = 0; i < chain.length; i++) {
    const p = chain[i], m = p.mesh;
    if (i > 0 || (cine.mode !== 'title' && cine.mode !== 'birth')) {
      const ahead = i === 0 ? tmpV.copy(L.pos).add(L.vel) : chain[i - 1].pos;
      m.position.copy(p.pos);
      if (ahead.distanceToSquared(p.pos) > 1e-4) m.lookAt(ahead);
      m.rotateZ(Math.sin(T * 2.6 + p.phase) * 0.9); m.rotateX(Math.sin(T * 3.1 + p.phase * 1.7) * 0.35);
    }
    const fade = 1 - sstep(0.8, 1.0, ageS) * 0.5;
    halos.pos.set([p.pos.x, p.pos.y, p.pos.z], i * 3); halos.col.set([p.color.r * fade, p.color.g * fade, p.color.b * fade], i * 3);
    halos.size[i] = i === 0 ? 1.15 : 1.4;
  }
  for (let i = chain.length; i <= CHAIN_MAX; i++) halos.size[i] = 0;
  halos.g.attributes.position.needsUpdate = halos.g.attributes.aColor.needsUpdate = halos.g.attributes.aSize.needsUpdate = true;
  if (flying) checkHazards();

  // --- flowers
  const cx = Math.floor(L.pos.x / CELL), cz = Math.floor(L.pos.z / CELL);
  magnet = null; let mBest = 81;
  if (flying) for (let ix = -1; ix <= 1; ix++) for (let iz = -1; iz <= 1; iz++) {
    const list = grid.get((cx + ix) + ',' + (cz + iz)); if (!list) continue;
    for (const f of list) if (f.alive && T > f.born + 1) { const rr = 2.8 * f.s, d2 = f.head.distanceToSquared(L.pos); if (d2 < rr * rr) collect(f); else if (d2 < mBest) { mBest = d2; magnet = f; } }
  }
  updateFlowers(dt);
  updateSparkles(dt);
  updateCurrentFx(dt);
  updateStreams(dt);

  // --- camera
  camera.position.lerp(camTarget, damp(camK, dt));
  const cg = G(camera.position.x, camera.position.z) + (flying ? 0.7 : 0.3);
  if (camera.position.y < cg) camera.position.y = cg;
  if (flying) resolve(camera.position, 0.5, _n.set(0, 0, 0));
  lookCur.lerp(lookAt, damp(cine.mode === 'follow' ? 12 : 3, dt));
  camera.lookAt(lookCur);
  if (shake > 0.001) { camera.position.x += (Math.random() - 0.5) * shake; camera.position.y += (Math.random() - 0.5) * shake; shake *= Math.exp(-dt * 6); }
  if (Math.abs(camera.fov - fovT) > 0.05) { camera.fov = lerp(camera.fov, fovT, damp(1.5, dt)); camera.updateProjectionMatrix(); }
  sky.position.copy(camera.position); stars.position.copy(camera.position);

  // --- the world answers the wind
  const fwdFlat = tmpV.set(Math.sin(L.yaw), 0, Math.cos(L.yaw));
  if (flying || cine.mode === 'ending') {
    grassShared.uWind.value.set(fwdFlat.x, fwdFlat.z);
    grassShared.uWindStr.value = lerp(grassShared.uWindStr.value, (L.vel.length() - 3) / 10 + ENV.storm * 0.4, damp(2, dt));
  }
  grassNear.uCenter.value.set(L.pos.x + fwdFlat.x * 22, L.pos.z + fwdFlat.z * 22);
  grassFar.uCenter.value.set(L.pos.x + fwdFlat.x * 60, L.pos.z + fwdFlat.z * 60);
  grassFar.uInnerC.value.copy(grassNear.uCenter.value);
  grassShared.uPetal.value.copy(L.pos);
  const night = sstep(0.9, 1.0, ageS), spring = 1 - sstep(0.15, 0.35, ageS);
  for (let i = 0; i < 320; i++) {
    const o = i * 3;
    if (pollen.size[i] === 0) {
      pollen.pos[o] = L.pos.x + (Math.random() - 0.5) * 50; pollen.pos[o + 1] = L.pos.y + (Math.random() - 0.4) * 14; pollen.pos[o + 2] = L.pos.z + (Math.random() - 0.5) * 50;
      pollen.size[i] = (0.12 + Math.random() * 0.18) * (1 + spring * 0.8 + night * 0.6);
      const w = 0.7 + Math.random() * 0.3;
      pollen.col.set([lerp(1.0, 0.8, night) * w, lerp(lerp(0.85, 1.0, spring), 1.0, night) * w, lerp(lerp(0.6, 1.0, spring), 0.45, night) * w], o);
    }
    pollen.pos[o] += (L.vel.x * 0.35 + Math.sin(T + i) * 0.3) * dt;
    pollen.pos[o + 1] += (Math.sin(T * 0.7 + i * 1.3) * 0.2 + spring * 0.15) * dt;
    pollen.pos[o + 2] += (L.vel.z * 0.35 + Math.cos(T * 0.8 + i) * 0.3) * dt;
    const dx = pollen.pos[o] - L.pos.x, dzz = pollen.pos[o + 2] - L.pos.z;
    if (dx * dx + dzz * dzz > 30 * 30 || Math.abs(pollen.pos[o + 1] - L.pos.y) > 12) pollen.size[i] = 0;
  }
  pollen.m.uniforms.uAlpha.value = (0.45 + night * 0.5) * (night > 0.1 ? 0.6 + 0.4 * Math.sin(T * 3) : 1);
  pollen.g.attributes.position.needsUpdate = pollen.g.attributes.aColor.needsUpdate = pollen.g.attributes.aSize.needsUpdate = true;
  const rp = rainGeo.attributes.position, storm = ENV.storm;
  rain.material.opacity = storm * 0.32; rain.visible = storm > 0.05;
  if (rain.visible) {
    for (let i = 0; i < rainN; i++) {
      const s = rainSeed[i]; s[1] -= dt * 1.1; if (s[1] < 0) { s[1] += 1; s[0] = Math.random() - 0.5; s[2] = Math.random() - 0.5; }
      const x = camera.position.x + s[0] * 60, z = camera.position.z + s[2] * 60, y = camera.position.y - 15 + s[1] * 35;
      rp.setXYZ(i * 2, x, y, z); rp.setXYZ(i * 2 + 1, x - 0.15, y - 1.1, z + 0.1);
    }
    rp.needsUpdate = true;
  }
  const leafN = Math.floor(LEAVES * sstep(0.6, 0.86, ageS));
  for (let i = 0; i < LEAVES; i++) {
    const s = leafS[i];
    if (i < leafN) {
      if (!s.live || s.p.y < G(s.p.x, s.p.z) - 0.5 || s.p.distanceToSquared(L.pos) > 40 * 40) { s.live = true; s.p.set(L.pos.x + (Math.random() - 0.5) * 50, L.pos.y + 5 + Math.random() * 12, L.pos.z + (Math.random() - 0.5) * 50); }
      s.v.set(Math.sin(T * 0.8 + i) * 0.8 + grassShared.uWind.value.x * 1.5, -0.9 - Math.sin(T * 1.3 + i) * 0.3, Math.cos(T * 0.7 + i) * 0.8 + grassShared.uWind.value.y * 1.5);
      s.p.addScaledVector(s.v, dt); s.r += dt * 2;
      leavesIM.setMatrixAt(i, mat(s.p.x, s.p.y, s.p.z, s.r, s.r * 0.7, s.r * 0.4, 1.2, 1.2, 1.2));
    } else if (s.live) { s.live = false; leavesIM.setMatrixAt(i, mat(0, -999, 0, 0, 0, 0, 0.001, 0.001, 0.001)); }
  }
  leavesIM.instanceMatrix.needsUpdate = true;

  updateLightning(dt);
  const ps = renderer.getPixelRatio() * innerHeight * 0.5 / Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  pointSets.concat([motes]).forEach(s => { s.m.uniforms.uTime.value = T; s.m.uniforms.uScale.value = ps; });
  updateAudio(dt);
  hintTimer -= dt;
  if (hintTimer <= 0) { hintTimer = 0.3; updateHint(fwdFlat); }
}

// ================= boot =================
buildFlowers(1000);
for (let i = 0; i < LEAVES; i++) leavesIM.setMatrixAt(i, mat(0, -999, 0, 0, 0, 0, 0.001, 0.001, 0.001));
applyEnv(0);
camera.position.copy(BIRTH_HEAD).add(new THREE.Vector3(2.2, 0.4, -2.2)); lookCur.copy(BIRTH_HEAD);

$('startBtn').addEventListener('click', () => {
  initAudio();
  if (window.__tiltRecenter) window.__tiltRecenter();
  $('startVeil').classList.add('gone');
  $('blow').classList.remove('off');
  blowCharge = 0;
  cine = { mode: 'birth', t: 0 };
});
let fitW = 0, fitH = 0;
function fit() { const w = VW(), h = VH(); if (w === fitW && h === fitH) return; fitW = w; fitH = h; camera.aspect = w / h; camera.updateProjectionMatrix(); renderer.setSize(w, h); }
window.__fit = fit; addEventListener('resize', fit); setInterval(fit, 600);

let lastT = performance.now(), perfT = 0, perfN = 0;
function frame(now) {
  const dt = Math.min(0.05, Math.max(0, (now - lastT) / 1000)); lastT = now;
  step(dt);
  perfT += dt; perfN++;
  if (perfT > 3) {
    const fps = perfN / perfT;
    if (fps < 40 && pixelRatio > 0.8) { pixelRatio = Math.max(0.8, pixelRatio - 0.2); renderer.setPixelRatio(pixelRatio); renderer.setSize(VW(), VH()); starsU.uPR.value = pixelRatio; }
    else if (fps > 57 && pixelRatio < PR_MAX - 0.01) { pixelRatio = Math.min(pixelRatio + 0.1, PR_MAX); renderer.setPixelRatio(pixelRatio); renderer.setSize(VW(), VH()); starsU.uPR.value = pixelRatio; }
    perfT = 0; perfN = 0;
  }
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

})();
</script>
